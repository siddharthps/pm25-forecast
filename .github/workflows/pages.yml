# Deploys the page (site/) to GitHub Pages (#14, T7; D-025, D-036).
#
# Go-live gate: the deploy job runs only when the repository variable PAGES_GO_LIVE is "true".
# The owner sets it once the signed AirNow Data Exchange Guidelines form has been emailed and
# any reply has come back (D-025: the page must not be public before that). Until then, the build
# job still runs on every change, so the page's files are checked and packaged, but nothing goes
# public.
#
# Only the page's own files are published (index.html, app.js, style.css): never tests, configs
# or data. Rules kept by tests/unit/test_ci_config.py and tests/unit/test_pages_workflow.py.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one mid-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Package the page
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Collect only the page's files
        run: |
          mkdir _site
          cp site/index.html site/app.js site/style.css _site/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site/

  deploy:
    name: Deploy (only after the go-live switch)
    needs: build
    if: vars.PAGES_GO_LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
