# Weekly Python dependency upgrades (D-027). Dependabot's bundled uv is older than our
# required-version floor, so this job runs `uv lock --upgrade` with the pinned uv and opens
# (or refreshes) one PR. It pushes and opens the PR with a GitHub App's installation token, not
# GITHUB_TOKEN: a GITHUB_TOKEN PR's CI waits for a person's approval, and a dispatched CI run
# doesn't count for the main ruleset (#115, D-049). The App's token runs the PR's own CI.
#
# Idempotent: one fixed branch and at most one open PR. A rerun force-updates the branch and
# reuses the PR; with no lockfile change it does nothing. The push and PR logic, and its tests,
# live in src/airwatch/devtools/uv_lock_pr.py (#43).
#
# Needs the App's client ID as the repo variable LOCK_APP_CLIENT_ID and its private key as the
# repo secret LOCK_APP_PRIVATE_KEY (notes/TOKENS.md).
name: uv lock upgrade

# No cron here (D-003: Actions is for CI only). The AWS watchdog dispatches it on Mondays at
# 08:00 Chicago and checks the run at 09:00 (#113, D-058); a person can dispatch it too.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uv-lock-upgrade
  cancel-in-progress: false

env:
  BRANCH: deps/uv-lock-upgrade

jobs:
  upgrade:
    name: Upgrade uv.lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # the App's token pushes and opens the PR; GITHUB_TOKEN writes nothing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.9"

      # A release must be 7 days old to come in, as Dependabot's cooldown does for Actions
      # (D-056). uv turns the span into a cutoff at this run; every pyproject minimum must be
      # older than it, or uv's error names the package and its upload time.
      - name: Upgrade the lockfile
        run: uv lock --upgrade --exclude-newer "7 days"

      # The Prefect run installs from this export, so it moves with the lock (D-040).
      - name: Regenerate the Prefect run's requirements
        run: uv export --frozen --no-dev --no-emit-project --no-header --format requirements.txt > requirements/prefect-run.txt

      # The watchdog's zip is built from this export (D-041).
      - name: Regenerate the watchdog's requirements
        run: uv export --frozen --only-group watchdog --no-emit-project --no-header --format requirements.txt > requirements/watchdog.txt

      # Expires within the hour and is revoked when the job ends; scoped to what the next step does.
      - name: Get the lock App's token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.LOCK_APP_CLIENT_ID }}
          private-key: ${{ secrets.LOCK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Standard library only, run by path: nothing from the upgraded lock is installed.
      - name: Push the branch, open or reuse the PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: uv run --no-project --python 3.12 src/airwatch/devtools/uv_lock_pr.py
