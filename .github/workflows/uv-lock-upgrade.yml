# Weekly Python dependency upgrades (D-027). Dependabot's bundled uv is older than our
# required-version floor, so this job runs `uv lock --upgrade` with the pinned uv and opens
# (or refreshes) one PR. PRs opened with GITHUB_TOKEN don't trigger workflows, so it then
# dispatches CI on the branch; the checks land on the PR's head commit.
#
# Idempotent: one fixed branch and at most one open PR. A rerun force-updates the branch and
# reuses the PR; with no lockfile change it does nothing. The push, PR and dispatch logic, and its
# tests, live in src/airwatch/devtools/uv_lock_pr.py (#43).
#
# Needs the repo setting: Settings → Actions → General → Workflow permissions →
# "Allow GitHub Actions to create and approve pull requests".
name: uv lock upgrade

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC (off the hour: GitHub's cron is busiest at :00)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uv-lock-upgrade
  cancel-in-progress: false

env:
  BRANCH: deps/uv-lock-upgrade

jobs:
  upgrade:
    name: Upgrade uv.lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # push the branch
      pull-requests: write  # open or update the PR
      actions: write  # dispatch CI on the branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.9"

      - name: Upgrade the lockfile
        run: uv lock --upgrade

      # The Prefect run installs from this export, so it moves with the lock (D-040).
      - name: Regenerate the Prefect run's requirements
        run: uv export --frozen --no-dev --no-emit-project --no-header --format requirements.txt > requirements/prefect-run.txt

      # The watchdog's zip is built from this export (D-041).
      - name: Regenerate the watchdog's requirements
        run: uv export --frozen --only-group watchdog --no-emit-project --no-header --format requirements.txt > requirements/watchdog.txt

      # Standard library only, run by path: nothing from the upgraded lock is installed.
      - name: Push the branch, open or reuse the PR, dispatch CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 src/airwatch/devtools/uv_lock_pr.py
