[project]
name = "airwatch"
version = "0.1.0"
description = "AirWatch: live next-day PM2.5 forecasts for a US metro area, with an honest public track record."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Siddharth Puranam" }]
# D-026: match the Python in Prefect's managed image (prefecthq/prefect:3-python3.12).
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.44.6",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pandas>=3.1.1",
    "prefect>=3.9.2",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.3",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.6",
    "hypothesis>=6.170.15",
    "moto>=5.2.5",
    "mutmut>=3.8.1",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261113",
]
docs = [
    "zensical==0.1.3",
]
watchdog = [
    "boto3>=1.44.6",
    "tzdata>=2026.6",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.9"

# ---------------------------------------------------------------------------
# Ruff: lint + format. It covers every folder by default; nothing is excluded,
# and tests/unit/test_lint_config.py fails if a code folder ever goes unlinted.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "PTH",      # pathlib over os.path
    "PL",       # pylint
    "RUF",      # ruff-specific
    "S",        # bandit (security)
    "N",        # naming
    "DTZ",      # no naive datetimes (the spec requires UTC with an explicit zone)
    "T20",      # no print(): use logging
    "ARG",      # unused arguments
    "ERA",      # commented-out code
]

[tool.ruff.format]
# Ruff also formats Python code blocks inside Markdown. The vendored agent skills are upstream
# files we don't edit (D-020), so the formatter skips exactly those in skills-lock.json
# (D-029). Our own docs and skills are still checked (tests/unit/test_lint_config.py).
exclude = [
    ".claude/skills/accessibility-engineering/**",
    ".claude/skills/api-and-interface-design/**",
    ".claude/skills/browser-testing-with-devtools/**",
    ".claude/skills/ci-cd-and-automation/**",
    ".claude/skills/code-review-and-quality/**",
    ".claude/skills/code-simplification/**",
    ".claude/skills/constraint-driven-development/**",
    ".claude/skills/context-engineering/**",
    ".claude/skills/debugging-and-error-recovery/**",
    ".claude/skills/deprecation-and-migration/**",
    ".claude/skills/documentation-and-adrs/**",
    ".claude/skills/doubt-driven-development/**",
    ".claude/skills/frontend-ui-engineering/**",
    ".claude/skills/git-workflow-and-versioning/**",
    ".claude/skills/idea-refine/**",
    ".claude/skills/incremental-implementation/**",
    ".claude/skills/interview-me/**",
    ".claude/skills/observability-and-instrumentation/**",
    ".claude/skills/performance-optimization/**",
    ".claude/skills/planning-and-task-breakdown/**",
    ".claude/skills/security-and-hardening/**",
    ".claude/skills/shipping-and-launch/**",
    ".claude/skills/source-driven-development/**",
    ".claude/skills/spec-driven-development/**",
    ".claude/skills/test-driven-development/**",
    ".claude/skills/using-agent-skills/**",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is how pytest works
    "PLR2004",  # magic values are normal in tests
    "S603",     # subprocess calls with fixed arguments in tool-config tests
]

# ---------------------------------------------------------------------------
# mypy: strict on src/ (spec); tests are type-checked but may skip annotations.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------------------
# pytest: plain `uv run pytest` runs the fast, offline core suite.
# `-m slow` / `-m live` select the others explicitly.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests run in parallel (pytest-xdist; owner, 2026-11-19, D-035) to keep the core suite under
# the SPEC's 30 s: 4 workers handed single tests (`load`) measured fastest here (D-035; 6 were
# no better when re-measured in D-046; 12 spend longer starting up than they save). Pass -n 0 to
# run serially, e.g. when debugging one test. CI fails a run past 75 s (SUITE_BUDGET_S, D-046).
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not slow and not live",
    "-n",
    "4",
    "--dist",
    "loadgroup",
]
markers = [
    "slow: model smoke tests on small data (not in the core suite)",
    "live: calls real external APIs; opt-in only, never in CI",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.mutmut]
source_paths = ["src/"]
only_mutate = [
    "src/airwatch/timeutil.py",
    "src/airwatch/config.py",
    "src/airwatch/weather/leads.py",
    "src/airwatch/observations/schema.py",
    "src/airwatch/forecast/run.py",
    "src/airwatch/forecast/record.py",
    "src/airwatch/storage.py",
    "src/airwatch/monitoring/compute.py",
    "src/airwatch/monitoring/score.py",
    "src/airwatch/validation/checks.py",
    "src/airwatch/validation/reference.py",
    "src/airwatch/forecast/publish.py",
    "src/airwatch/watchdog/handler.py",
    "src/airwatch/weather/cams.py",
    "src/airwatch/weather/cams_save.py",
    "src/airwatch/features/build.py",
]
also_copy = [
    ".claude/",
    ".env.example",
    ".gitattributes",
    ".github/",
    ".gitignore",
    ".markdownlint-cli2.yaml",
    ".nvmrc",
    ".pre-commit-config.yaml",
    ".python-version",
    ".vale.ini",
    "CLAUDE.md",
    "DEVELOPMENT.md",
    "LICENSE",
    "README.md",
    "biome.json",
    "comment-baseline.json",
    "docs/",
    "infra/",
    "notes/",
    "prefect.yaml",
    "pyproject.toml",
    "requirements/",
    "results/",
    "scripts/",
    "site/",
    "skills-lock.json",
    "styles/",
    "tasks/",
    "tests/",
    "uv.lock",
    "zensical.toml",
]
pytest_add_cli_args_test_selection = [
    "tests/unit",
    "tests/property",
    "tests/integration",
    "--deselect",
    "tests/unit/devtools/test_comments.py::test_the_repository_keeps_to_its_baseline",
    "--deselect",
    "tests/unit/test_mutmut_config.py::test_every_tracked_top_level_entry_is_copied",
]
pytest_add_cli_args = ["-n", "0", "-p", "no:cacheprovider"]

[tool.coverage.run]
source = ["airwatch"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# The spec's 85% floor, on since the first feature modules (config, timeutil; #7, T3).
# tests/unit/test_ci_config.py fails if it is lowered.
fail_under = 85
